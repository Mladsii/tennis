<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tennis Partner</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
    button { margin: 10px 0; padding: 12px 24px; background: #3390EC; color: white; border: none; border-radius: 8px; }
    select, input { width: 100%; padding: 10px; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>🎾 Найди партнёра за 2 минуты</h1>

  <div id="screen-welcome" style="display:none;">
    <button onclick="showProfile()">👤 Профиль</button>
    <button onclick="findPartners()">🎾 Найти партнёра</button>
  </div>

  <div id="screen-profile" style="display:none;">
    <h2>Профиль</h2>
    <button onclick="showWelcome()" style="background:#6c757d;">← Назад</button>
    <select id="level">
      <option value="2.5">Beginner / 2.5</option>
      <option value="3.0">3.0</option>
      <option value="3.5" selected>3.5</option>
      <option value="4.0">4.0+</option>
    </select>
    <select id="district">
      <option value="Center">Center</option>
      <option value="West" selected>West</option>
      <option value="East">East</option>
    </select>
    <div>
      <label><input type="checkbox" id="avail_evening" checked> Будни вечер</label>
      <label><input type="checkbox" id="avail_weekend"> Выходные</label>
    </div>
    <button onclick="saveProfile()">💾 Сохранить</button>
  </div>

  <div id="screen-partners" style="display:none;">
    <h2>Партнёры рядом</h2>
    <button onclick="showWelcome()" style="background:#6c757d;">← Назад</button>
    <div id="partners-list"></div>
    <button onclick="showWelcome()">← Назад</button>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // === CONFIG ===
    const N8N_URL = 'https://n8nai-agentmmi.ru/webhook-test/98aecc7e-75ec-48dc-9a49-422dd0c2dcf4'; // ← ЗАМЕНИ НА СВОЙ NGROK URL

    // === INIT ===
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const user = Telegram.WebApp.initDataUnsafe?.user;
    if (!user) {
      alert('Откройте через Telegram!');
    } else {
      window.telegramId = user.id;
      window.userName = user.first_name || 'Player';
      loadProfile(); // проверим, есть ли профиль
    }

    // === SCREENS ===
    function showWelcome() {
      document.getElementById('screen-welcome').style.display = 'block';
      document.getElementById('screen-profile').style.display = 'none';
      document.getElementById('screen-partners').style.display = 'none';
    }

    function showProfile() {
      document.getElementById('screen-welcome').style.display = 'none';
      document.getElementById('screen-profile').style.display = 'block';
    }

    function showPartners() {
      document.getElementById('screen-welcome').style.display = 'none';
      document.getElementById('screen-partners').style.display = 'block';
    }

    // === PROFILE ===
    async function loadProfile() {
      // Можно добавить проверку профиля позже
      showWelcome();
    }

    async function saveProfile() {
      const data = {
        telegram_id: window.telegramId,
        name: window.userName,
        level: document.getElementById('level').value,
        district: document.getElementById('district').value,
        availability: [
          ...(document.getElementById('avail_evening').checked ? ['evening'] : []),
          ...(document.getElementById('avail_weekend').checked ? ['weekend'] : [])
        ],
        format: ['single'] // можно расширить
      };

      try {
        const res = await fetch(N8N_URL + '/profile', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
        if (res.ok) {
          alert('✅ Профиль сохранён!');
          showWelcome();
        } else {
          alert('❌ Ошибка сохранения');
        }
      } catch (e) {
        alert('🌐 Нет связи с сервером');
      }
    }

    // === PARTNERS ===
    async function findPartners() {
      showPartners();
      const listEl = document.getElementById('partners-list');
      listEl.innerHTML = '<p>Загрузка...</p>';

      try {
        const res = await fetch(`${N8N_URL}/partners?telegram_id=${window.telegramId}`);
        const partners = await res.json();

        if (!partners.length) {
          listEl.innerHTML = '<p>Никого нет 😕</p>';
          return;
        }

        listEl.innerHTML = partners.map(p => `
          <div style="border:1px solid #eee; padding:12px; margin:10px 0; border-radius:8px;">
            <strong>${p.name}</strong> • ${p.level} • ${p.district}<br>
            <button onclick="openChat('${p.telegram_id}')">Написать</button>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = '<p>Ошибка загрузки</p>';
      }
    }

    // === TELEGRAM CHAT ===
    function openChat(telegramId) {
      // Telegram не даёт открыть чат по ID напрямую.
      // Решение: отправим сообщение через бота (позже в n8n),
      // А пока — просто покажем уведомление.
      Telegram.WebApp.showAlert(`Скоро сможешь написать ${telegramId}!`);
      // В будущем: вызов webhook в n8n, который отправит сообщение от бота
    }
  </script>
</body>
</html>
