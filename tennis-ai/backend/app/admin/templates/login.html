<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Вход — Tennis AI Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css">
  <style>
    :root {
      --tblr-font-sans-serif: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #0f172a;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: none;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #6d28d9);
      border: none;
    }
    .divider-line {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 24px 0;
    }
    .field-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }
    .input-with-icon {
      padding-left: 40px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100 antialiased">
  <div class="page page-center flex-grow-1">
    <div class="container container-tight py-4">

      <!-- Logo -->
      <div class="text-center mb-4">
        <div class="brand-logo mx-auto mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M 6 12 Q 12 6 18 12"/>
            <path d="M 6 12 Q 12 18 18 12"/>
          </svg>
        </div>
        <h2 class="fw-bold mb-1" style="letter-spacing:-0.5px;">Tennis<span class="text-primary">AI</span></h2>
        <p class="text-muted mb-0" style="font-size:14px;">Панель администратора</p>
      </div>

      <!-- Card -->
      <div class="login-card p-4 p-md-5">

        {% if error %}
        <div class="alert alert-danger alert-dismissible mb-4" role="alert">
          <div class="d-flex align-items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <h3 class="fw-semibold mb-1" style="font-size:20px;">Добро пожаловать</h3>
        <p class="text-muted mb-4" style="font-size:14px;">Войдите в систему управления</p>

        <form action="/panel/login" method="post" autocomplete="off">

          <div class="mb-3">
            <label class="form-label fw-medium">Номер телефона</label>
            <div class="position-relative">
              <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.42 2 2 0 0 1 3.58 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input
                type="tel"
                name="phone"
                class="form-control input-with-icon"
                placeholder="+70001110001"
                required
                autofocus
                style="height:44px; font-size:15px;"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-medium">Пароль</label>
            <div class="position-relative">
              <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input
                type="password"
                name="password"
                class="form-control input-with-icon"
                placeholder="••••••••"
                required
                style="height:44px; font-size:15px;"
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" style="height:44px; font-size:15px; font-weight:600; letter-spacing:0.3px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Войти в панель
          </button>
        </form>

        <div class="divider-line"></div>
        <p class="text-center text-muted mb-0" style="font-size:12px;">
          Доступ только для администраторов системы
        </p>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js"></script>
</body>
</html>
